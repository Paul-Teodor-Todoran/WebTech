<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-image">
            <img src="../MEDIA/INFO_Asset%2010.png" alt="UVT Facultatea de Informatică">
        </div>
        <div class="separator"></div>
        <form class="login-form" id="login-form">
            <h1>Login</h1>
            <input type="email" id="email" placeholder="Email" aria-label="Email" autocomplete="username" required>
            <input type="password" id="password" placeholder="Parola" aria-label="Parola" autocomplete="current-password" required>
            <button type="submit">Login</button>
            <p class="register-text">
                Nu ai cont? <a href="register.html">Înregistrează-te</a>
            </p>
        </form>
    </div>
    <script src="../JS/login_js.js"></script>
</body>
</html>
