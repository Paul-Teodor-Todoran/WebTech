<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrează-te</title>
    <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
    <main class="page">
        <section class="card" aria-labelledby="register-title">
            <h1 id="register-title">Înregistrează-te</h1>
            <form class="register-form" action="#" method="post" enctype="multipart/form-data">
                <div class="row">
                    <label for="username">Nume utilizator</label>
                    <input type="text" id="username" name="username" placeholder="ex: matei02" autocomplete="username" required>
                </div>
                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="ex: nume@exemplu.com" autocomplete="email" required>
                </div>
                <div class="row two-col">
                    <div>
                        <label for="password">Parolă</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" required>
                    </div>
                    <div>
                        <label for="confirm_password">Confirmă parola</label>
                        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
                    </div>
                </div>
                <fieldset class="row gender-options">
                    <legend>Gen</legend>
                    <label for="female">Femeie <input type="radio" id="female" name="gender" value="female"></label>
                    <label for="male">Bărbat <input type="radio" id="male" name="gender" value="male"></label>
                    <label for="other">Altul <input type="radio" id="other" name="gender" value="other"></label>
                </fieldset>
                <div class="row">
                    <label for="account_type">Tip cont</label>
                    <select id="account_type" name="account_type" required>
                        <option value="" disabled selected>Selectează</option>
                        <option value="student">Student</option>
                        <option value="teacher">Profesor</option>
                        <option value="other">Altul</option>
                    </select>
                </div>
                <fieldset class="row">
                    <legend>Interese</legend>
                    <div class="checkbox-grid">
                        <label for="frontend"><input type="checkbox" id="frontend" name="interests" value="frontend">Frontend</label>
                        <label for="backend"><input type="checkbox" id="backend" name="interests" value="backend">Backend</label>
                        <label for="uiux"><input type="checkbox" id="uiux" name="interests" value="uiux">UI/UX</label>
                        <label for="javascript"><input type="checkbox" id="javascript" name="interests" value="javascript">JavaScript</label>
                        <label for="python"><input type="checkbox" id="python" name="interests" value="python">Python Web</label>
                        <label for="wordpress"><input type="checkbox" id="wordpress" name="interests" value="wordpress">WordPress</label>
                        <label for="django"><input type="checkbox" id="django" name="interests" value="django">Django</label>
                    </div>
                </fieldset>
                <div class="row">
                    <label for="avatar">Încarcă avatar</label>
                    <input type="file" id="avatar" name="avatar" accept="image/*">
                </div>
                <div class="row">
                    <label for="description">Scurtă descriere</label>
                    <textarea id="description" name="description" rows="3" placeholder="Scrie câteva cuvinte despre tine..."></textarea>
                </div>
                <div class="actions">
                    <button type="submit" class="btn primary">Creează cont</button>
                    <button type="reset" class="btn ghost">Resetează</button>
                </div>
                <p class="login-link">Ai deja cont? <a href="login.html">Mergi la login</a></p>
            </form>
        </section>
    </main>
</body>
</html>
